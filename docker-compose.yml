# Local development stack (Docker-first).
# Production Nginx is Phase 17 — keep this file for local only.
# Ports come from .env (BACKEND_PORT, CLIENT_UI_PORT, ADMIN_UI_PORT).

services:
  # PostgreSQL — DATABASE_* from .env; healthcheck gates backend start.
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "${DATABASE_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Django API — bind-mount for live code reload.
  backend:
    build:
      context: ./backend
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

  # Client UI — marketing, login, researcher dashboard (Phases 9–11).
  client-ui:
    build:
      context: ./client-ui
    env_file:
      - .env
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      CLIENT_UI_PORT: ${CLIENT_UI_PORT}
    ports:
      - "${CLIENT_UI_PORT}:${CLIENT_UI_PORT}"
    volumes:
      - ./client-ui:/app
      - client_ui_node_modules:/app/node_modules
    depends_on:
      - backend

  # Admin UI (Phase 12); admin API routes require this Origin.
  admin-ui:
    build:
      context: ./admin-ui
    env_file:
      - .env
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      ADMIN_UI_PORT: ${ADMIN_UI_PORT}
    ports:
      - "${ADMIN_UI_PORT}:${ADMIN_UI_PORT}"
    volumes:
      - ./admin-ui:/app
      - admin_ui_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  client_ui_node_modules:
  admin_ui_node_modules:
