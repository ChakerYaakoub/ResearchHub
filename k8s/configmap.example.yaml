# Example ConfigMap for local Docker Desktop Kubernetes.
# Prefer: make k8s-sync-env (copies values from repo-root .env).
# This file is the safe committed template when .env sync is not used.
apiVersion: v1
kind: ConfigMap
metadata:
  name: researchhub-config
  namespace: researchhub
data:
  DEBUG: "True"
  ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
  DATABASE_NAME: researchhub
  DATABASE_USER: researchhub
  DATABASE_HOST: postgres
  DATABASE_PORT: "5432"
  CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:5175"
  CSRF_TRUSTED_ORIGINS: "http://localhost:5173,http://localhost:5175"
  ADMIN_UI_ORIGINS: "http://localhost:5175"
  VITE_API_BASE_URL: "http://localhost:8000/api"
  CLIENT_UI_PORT: "5173"
  ADMIN_UI_PORT: "5175"
  CLIENT_UI_ORIGIN: "http://localhost:5173"
  EMAIL_BACKEND: "django.core.mail.backends.console.EmailBackend"
  DEFAULT_FROM_EMAIL: "ResearchHub <noreply@example.com>"
  EMAIL_HOST: "smtp.example.com"
  EMAIL_PORT: "587"
  EMAIL_USE_TLS: "True"
  AUTH_RATE_LIMIT: "5/m"
  PASSWORD_RESET_RATE_LIMIT: "2/m"
  PUBLIC_DOMAIN: "localhost"
