apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-ui
  namespace: researchhub
  labels:
    app: client-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client-ui
  template:
    metadata:
      labels:
        app: client-ui
    spec:
      containers:
        - name: client-ui
          image: researchhub-client-ui:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5173
          env:
            - name: CLIENT_UI_PORT
              valueFrom:
                configMapKeyRef:
                  name: researchhub-config
                  key: CLIENT_UI_PORT
            - name: VITE_API_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: researchhub-config
                  key: VITE_API_BASE_URL
          readinessProbe:
            tcpSocket:
              port: 5173
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: client-ui
  namespace: researchhub
spec:
  type: LoadBalancer
  selector:
    app: client-ui
  ports:
    - port: 5173
      targetPort: 5173
