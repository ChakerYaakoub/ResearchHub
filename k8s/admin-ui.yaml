apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-ui
  namespace: researchhub
  labels:
    app: admin-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-ui
  template:
    metadata:
      labels:
        app: admin-ui
    spec:
      containers:
        - name: admin-ui
          image: researchhub-admin-ui:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5175
          env:
            - name: ADMIN_UI_PORT
              valueFrom:
                configMapKeyRef:
                  name: researchhub-config
                  key: ADMIN_UI_PORT
            - name: VITE_API_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: researchhub-config
                  key: VITE_API_BASE_URL
          readinessProbe:
            tcpSocket:
              port: 5175
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: admin-ui
  namespace: researchhub
spec:
  type: LoadBalancer
  selector:
    app: admin-ui
  ports:
    - port: 5175
      targetPort: 5175
