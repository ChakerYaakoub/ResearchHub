# Example Secret for local Docker Desktop Kubernetes.
# Prefer: make k8s-sync-env (copies SECRET_KEY / DB / SMTP from repo-root .env).
# Manual fallback: copy to secret.yaml and edit (secret.yaml is gitignored).
apiVersion: v1
kind: Secret
metadata:
  name: researchhub-secret
  namespace: researchhub
type: Opaque
stringData:
  SECRET_KEY: change-me-in-development
  DATABASE_PASSWORD: changeme
  EMAIL_HOST_USER: ""
  EMAIL_HOST_PASSWORD: ""
